# Phase 0 only: publishes spike/ so it can be opened on phones over HTTPS.
# Replaced by deploy.yml (the real app build) in Phase 1.
name: Deploy spike to GitHub Pages

on:
  push:
    branches: [main]
    paths: [spike/**, .github/workflows/spike-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spike
      - id: deployment
        uses: actions/deploy-pages@v4
